<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Part Coding — RK Supply</title>
<style>
  :root{
    --green:#22A45D;
    --blue:#2563C9;
    --red:#D93B3B;
    --grey:#6B7280;
    --ink:#1A1D21;
    --rk-red:#E03127;
    --line:#E3E6E9;
    --rowline:#EDEFF1;
    --thead:#F5F6F7;
    --pill:#F1F3F5;
    --hover:#F8F9FA;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#EEF0F2;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding:20px;
  }
  button,input,select{font:inherit;color:inherit;}
  button{cursor:pointer;background:none;border:none;}

  /* ---------- app shell ---------- */
  .card{
    height:100%;
    background:#fff;
    border-radius:10px;
    box-shadow:0 6px 24px rgba(20,26,34,.13), 0 1px 3px rgba(20,26,34,.07);
    display:flex;
    overflow:hidden;
  }

  /* ---------- sidebar ---------- */
  .sidebar{
    width:184px;flex:none;   /* 165px -> 184px so "Admin Part Coding" stays on one line */
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    padding:22px 0 20px;
  }
  .logo{padding:0 18px 24px 22px;}
  .logo img{display:block;width:100%;height:auto;max-width:132px;}
  .nav{display:flex;flex-direction:column;gap:2px;padding:0 10px;}
  .nav-item{
    display:flex;align-items:center;gap:9px;width:100%;text-align:left;
    font-size:13px;color:var(--grey);white-space:nowrap;
    padding:9px 10px;border-radius:5px;position:relative;
  }
  .nav-item svg{flex:none;stroke:var(--grey);}
  .nav-item:hover{background:var(--hover);}
  .nav-item.active{background:var(--pill);color:var(--ink);font-weight:600;}
  .nav-item.active svg{stroke:var(--ink);}
  .nav-item.active::before{
    content:"";position:absolute;left:0;top:4px;bottom:4px;
    width:3px;border-radius:2px;background:var(--rk-red);
  }
  .nav-foot{margin-top:auto;padding:0 10px;}

  /* ---------- main ---------- */
  .main{flex:1;min-width:0;padding:22px 24px 18px;display:flex;flex-direction:column;}
  .titlerow{display:flex;align-items:baseline;gap:10px;}
  h1{font-size:22px;font-weight:600;letter-spacing:-.2px;}
  .subcount{font-size:12px;color:#8A9099;}

  /* toolbar */
  .toolbar{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .ctl{
    font-size:12px;line-height:1;
    border:1px solid var(--line);
    background:#fff;color:#3B4149;
    border-radius:5px;padding:7px 10px;
    white-space:nowrap;
  }
  select.ctl{background:#FAFBFC;padding-right:22px;max-width:210px;
    appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='6'><path d='M0 0h8L4 6z' fill='%239AA1AA'/></svg>");
    background-repeat:no-repeat;background-position:right 8px center;}
  select.ctl:focus,input.ctl:focus{outline:2px solid #C9D8F2;outline-offset:-1px;}
  input.ctl{width:170px;}
  .ctl.btn:hover{background:var(--hover);}
  .ctl.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:600;}
  .ctl.primary:hover{background:#1C8E50;}
  .ctl.ghost{border-color:transparent;color:#8A9099;}
  .ctl.ghost:hover{background:var(--hover);color:#3B4149;}
  .spacer{margin-left:auto;}
  .src{font-size:11px;color:#8A9099;white-space:nowrap;}

  /* summary strip */
  .summary{display:flex;align-items:center;gap:8px;margin-top:13px;font-size:12px;flex-wrap:wrap;}
  .summary .total{font-weight:600;margin-right:2px;}
  .cnt{
    font-size:11px;line-height:1;border-radius:999px;padding:5px 9px;font-weight:600;
    border:1px solid transparent;
  }
  .cnt.g{background:#E6F5ED;color:#177A45;}
  .cnt.b{background:#E7EEFA;color:#1E4FA3;}
  .cnt.r{background:#FBE9E9;color:#B32C2C;}
  .cnt.n{background:#F0F1F3;color:#5A6069;}
  .cnt[aria-pressed="true"]{border-color:currentColor;box-shadow:0 0 0 1px currentColor;font-weight:800;}
  .cnt.dim{opacity:.45;}

  /* ---------- table ---------- */
  .tablewrap{
    margin-top:13px;flex:1;min-height:0;
    overflow:auto;
    border:1px solid var(--line);border-radius:6px;
  }
  table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:1040px;}
  thead th{
    position:sticky;top:0;z-index:2;
    background:var(--thead);
    font-size:10px;font-weight:600;letter-spacing:.55px;text-transform:uppercase;
    color:#8A9099;text-align:left;
    padding:0;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  thead th button{
    width:100%;text-align:left;padding:9px 10px;font:inherit;color:inherit;
    letter-spacing:inherit;text-transform:inherit;
  }
  thead th button:hover{color:#5A6069;}
  th .caret{opacity:0;margin-left:3px;}
  th.sorted .caret{opacity:1;color:#5A6069;}
  tbody td{
    font-size:12px;color:#33383F;
    padding:9px 10px;
    border-bottom:1px solid var(--rowline);
    vertical-align:middle;
  }
  tbody tr:hover td{background:var(--hover);}
  tbody tr.off td{opacity:.5;}
  .dash{color:#C2C7CD;}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
  .num.zero{color:var(--red);font-weight:700;}
  .cust{font-weight:500;color:var(--ink);}
  .empty td{padding:40px 10px;text-align:center;color:#8A9099;font-size:13px;}

  .tp{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.5px;
      line-height:1;padding:5px 8px;border-radius:999px;white-space:nowrap;}
  .tp.PREFERENCE{background:#E6F5ED;color:#177A45;}
  .tp.REQUIREMENT{background:#E7EEFA;color:#1E4FA3;}
  .tp.EXCLUSION{background:#FBE9E9;color:#B32C2C;}
  .tp.NOTE{background:#F0F1F3;color:#5A6069;}

  .chip{display:inline-block;font-size:10.5px;color:#5A6069;white-space:nowrap;
        background:var(--pill);border-radius:4px;padding:4px 6px;line-height:1;}

  .ladder{display:flex;flex-wrap:wrap;gap:4px 9px;align-items:center;}
  .brand{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;white-space:nowrap;}
  .rank{width:14px;height:14px;border-radius:50%;background:#E9EBEE;color:var(--grey);
        font-size:9px;font-weight:700;display:inline-flex;align-items:center;
        justify-content:center;font-variant-numeric:tabular-nums;flex:none;}

  .tog{width:26px;height:15px;border-radius:999px;background:#CDD2D8;
       position:relative;display:inline-block;transition:background .12s;vertical-align:middle;}
  .tog::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;
              border-radius:50%;background:#fff;transition:transform .12s;}
  .tog[aria-pressed="true"]{background:var(--green);}
  .tog[aria-pressed="true"]::after{transform:translateX(11px);}

  .rowact{display:flex;gap:2px;}
  .iconbtn{padding:4px;border-radius:4px;line-height:0;opacity:0;color:#8A9099;}
  tbody tr:hover .iconbtn{opacity:1;}
  .iconbtn:hover{background:#E9EBEE;color:var(--ink);}
  .iconbtn.danger:hover{background:#FBE9E9;color:var(--red);}

  /* ---------- modal ---------- */
  .backdrop{
    position:fixed;inset:0;background:rgba(20,26,34,.35);
    display:flex;align-items:center;justify-content:center;padding:24px;z-index:50;
  }
  .backdrop[hidden]{display:none;}
  .modal{
    background:#fff;border-radius:10px;width:640px;max-width:100%;
    max-height:100%;display:flex;flex-direction:column;
    box-shadow:0 20px 50px rgba(20,26,34,.28);
  }
  .modal header{padding:18px 22px 14px;border-bottom:1px solid var(--line);
                display:flex;align-items:center;justify-content:space-between;}
  .modal h2{font-size:16px;font-weight:600;}
  .modal .body{padding:18px 22px;overflow:auto;}
  .modal footer{padding:14px 22px;border-top:1px solid var(--line);
                display:flex;align-items:center;gap:8px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.wide{grid-column:1 / -1;}
  label{font-size:10px;font-weight:600;letter-spacing:.55px;text-transform:uppercase;color:#8A9099;}
  .field input,.field select,.field textarea{
    font-size:13px;border:1px solid var(--line);border-radius:5px;padding:8px 9px;
    background:#fff;width:100%;font-family:inherit;
  }
  .field textarea{resize:vertical;min-height:56px;}
  .field input:focus,.field select:focus,.field textarea:focus{
    outline:2px solid #C9D8F2;outline-offset:-1px;}
  .hint{font-size:11px;color:#8A9099;}

  .ladderedit{display:flex;flex-direction:column;gap:6px;}
  .ledrow{display:flex;align-items:center;gap:6px;}
  .ledrow .rank{flex:none;}
  .ledrow input{flex:1;}
  .err{color:var(--red);font-size:12px;}
  /* ---------- view switching ---------- */
  .view{flex:1;min-height:0;display:flex;flex-direction:column;}
  .view[hidden]{display:none;}

  /* amber pill — new palette variant, follows the g/b/r/n pattern above */
  .cnt.w{background:#FCEBCD;color:#8A5A0B;}
  /* out-of-stock pill — confident match, zero on-hand; own bucket vs. Manual so the
     reason isn't buried inside a free-text field */
  .cnt.o{background:#FCE7D5;color:#9A4A0A;}
  .ctl:disabled{opacity:.55;cursor:default;}

  /* ---------- part coding ---------- */
  .paste{margin-top:13px;}
  .paste textarea{
    width:100%;height:147px;resize:vertical;display:block;
    border:1px solid var(--line);border-radius:6px;background:#fff;
    padding:10px 12px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    font-size:11.5px;line-height:1.8;color:#33383F;white-space:pre;
  }
  .paste textarea:focus{outline:2px solid #C9D8F2;outline-offset:-1px;}

  .st{display:inline-block;font-size:10.5px;font-weight:600;line-height:1;
      padding:5px 10px;border-radius:999px;white-space:nowrap;}
  .st.auto{background:#D9F2E4;color:#177A45;}
  .st.review{background:#FCE3B4;color:#8A5A0B;}
  .st.rfq{background:#FBC3C3;color:#A82626;}
  .st.manual{background:#CFE0F5;color:#2A5DA8;}
  .st.coded{background:#F0F1F3;color:#5A6069;}
  .st.oos{background:#FBDCC4;color:#9A4A0A;}

  .mba{display:inline-block;font-size:10px;font-weight:700;line-height:1;
       padding:4px 7px;border-radius:999px;}
  .mba.yes{background:#D9F2E4;color:#177A45;}
  .mba.no{background:#FBC3C3;color:#A82626;}

  .code{color:var(--blue);font-weight:500;}
  .rkph{display:block;background:#EDEFF1;border-radius:4px;color:#9AA1AA;
        padding:5px 8px;font-size:11.5px;}
  .right{text-align:right;}

  .infobtn{padding:3px;border-radius:4px;line-height:0;color:var(--blue);}
  .infobtn:hover{background:#E7EEFA;}
  .appwrap{display:flex;gap:3px;align-items:center;}
  .appbtn{padding:2px;border-radius:50%;line-height:0;}
  .appbtn.ok{color:var(--green);}
  .appbtn.ok:hover{background:#E6F5ED;}
  .appbtn.no{color:var(--red);}
  .appbtn.no:hover{background:#FBE9E9;}
  .appstate{font-size:10.5px;font-weight:600;white-space:nowrap;}
  .appstate.ok{color:#177A45;}
  .appstate.no{color:#B32C2C;}

  .proc{font-size:12px;color:#8A9099;display:flex;align-items:center;gap:7px;}
  .proc[hidden]{display:none;}
  .spin{width:12px;height:12px;flex:none;border-radius:50%;
        border:2px solid #D9DDE2;border-top-color:var(--blue);
        animation:sp .7s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){.spin{animation-duration:2.2s;}}

  /* ---------- candidate popover ---------- */
  .pop{
    position:fixed;z-index:55;width:440px;max-width:calc(100vw - 24px);
    background:#fff;border:1px solid var(--line);border-radius:9px;
    box-shadow:0 16px 44px rgba(20,26,34,.22), 0 2px 6px rgba(20,26,34,.10);
    padding:14px 15px 13px;
  }
  .pop[hidden]{display:none;}
  .pop h3{font-size:13px;font-weight:700;}
  .pop .sub{font-size:11px;color:#8A9099;margin-top:1px;}
  .candhead{display:flex;gap:6px;font-size:9.5px;font-weight:600;letter-spacing:.5px;
            text-transform:uppercase;color:#8A9099;
            margin-top:11px;padding:0 4px 5px;border-bottom:1px solid var(--line);}
  .candlist{max-height:176px;overflow:auto;margin:3px -4px 0;}
  .cand{display:flex;gap:6px;align-items:center;width:100%;text-align:left;
        padding:6px 4px;border-radius:5px;font-size:11.5px;}
  .cand:hover{background:var(--hover);}
  .cand[aria-pressed="true"]{background:#EAF1FC;}
  .cc{flex:1;min-width:0;}
  .cm{width:54px;flex:none;text-align:right;}
  .ci{width:42px;flex:none;text-align:right;color:#6B7280;font-size:11px;}
  .ci.zero{color:var(--red);font-weight:700;}
  .ccode{font-weight:600;color:var(--ink);}
  .cdesc{display:block;color:#6B7280;font-size:10.5px;margin-top:1px;
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mp{display:inline-block;font-size:10px;font-weight:700;line-height:1;
      padding:4px 6px;border-radius:999px;}
  .mp.hi{background:#D9F2E4;color:#177A45;}
  .mp.mid{background:#FCEBCD;color:#8A5A0B;}
  .mp.lo{background:#FBC3C3;color:#A82626;}
  .popgrid{display:flex;gap:8px;margin-top:11px;}
  .popgrid > *{flex:1;min-width:0;}
  .searchwrap{position:relative;}
  .searchwrap .popin{padding-right:26px;}
  .searchwrap svg{position:absolute;right:8px;top:50%;transform:translateY(-50%);
                  stroke:#9AA1AA;fill:none;pointer-events:none;}
  .popin{font-size:12px;border:1px solid var(--line);border-radius:5px;
         padding:7px 9px;background:#fff;width:100%;font-family:inherit;}
  .popin:focus{outline:2px solid #C9D8F2;outline-offset:-1px;}
  textarea.popin{resize:vertical;min-height:58px;margin-top:8px;display:block;}
  .popfoot{display:flex;align-items:center;margin-top:11px;}

  /* ---------- batch selection (Part Coding Admin) ---------- */
  input.cb{width:13px;height:13px;margin:0;display:block;
           accent-color:var(--blue);cursor:pointer;}
  input.cb:disabled{cursor:default;opacity:.4;}
  .chk{padding:9px 6px 9px 12px;}
  thead th.chk{padding-top:9px;padding-bottom:9px;}
  tbody tr.selrow td{background:#EFF5FD;}
  .bulk{display:flex;align-items:center;gap:7px;}
  .bulk[hidden]{display:none;}
  .bulkn{font-size:11.5px;font-weight:600;color:#5A6069;}
  .ctl.danger{color:#B32C2C;}
  .ctl.danger:hover{background:#FBE9E9;border-color:#F1C9C9;}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:var(--ink);color:#fff;font-size:12.5px;
    padding:9px 15px;border-radius:6px;z-index:60;
    box-shadow:0 6px 20px rgba(20,26,34,.28);
  }
  .toast[hidden]{display:none;}
</style>
</head>

const STORE_KEY = "rk_customer_rules_v1";
const TYPES = ["PREFERENCE", "REQUIREMENT", "EXCLUSION", "NOTE"];
const COLUMNS = ["customer", "division", "category", "end", "size",
                 "type", "ladder", "detail", "active"];
const HEADERS = ["Customer", "Division", "Category", "End", "Size",
                 "Type", "Brand / Ladder", "Rule Detail", "Active"];

let rules = load();
let sort = { key: "customer", dir: 1 };
let typeFilter = new Set();
let editingId = null;

/* ---------------------------- storage ---------------------------- */
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* fall through to seed */ }
  return structuredClone(SEED);
}
function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(rules));
  } catch (e) {
    toast("Couldn't save to this browser — changes last until reload.");
  }
}

/* ---------------------------- helpers ---------------------------- */
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function nextId() {
  const nums = rules.map(r => parseInt(String(r.id).replace(/\D/g, ""), 10) || 0);
  return "R" + String(Math.max(0, ...nums) + 1).padStart(3, "0");
}

let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2800);
}

function uniq(key) {
  return [...new Set(rules.map(r => (r[key] || "").trim()).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b));
}

/* --------------------------- filtering --------------------------- */
function activeFilters() {
  return {
    customer: $("#fCustomer").value,
    division: $("#fDivision").value,
    category: $("#fCategory").value,
    end: $("#fEnd").value,
    q: $("#fSearch").value.trim().toLowerCase(),
  };
}

/** Rows matching everything except the type pills — the pills' counts are
 *  computed against this set so they stay meaningful while filtering. */
function baseFiltered() {
  const f = activeFilters();
  return rules.filter(r => {
    if (f.customer && r.customer !== f.customer) return false;
    if (f.division && (r.division || "") !== f.division) return false;
    if (f.category && r.category !== f.category) return false;
    if (f.end && (r.end || "") !== f.end) return false;
    if (f.q) {
      const hay = [r.customer, r.division, r.category, r.end, r.size,
                   r.type, (r.ladder || []).join(" "), r.detail]
                   .join(" ").toLowerCase();
      if (!hay.includes(f.q)) return false;
    }
    return true;
  });
}

function visibleRules() {
  let out = baseFiltered();
  if (typeFilter.size) out = out.filter(r => typeFilter.has(r.type));
  const { key, dir } = sort;
  return out.sort((a, b) => {
    let av = a[key], bv = b[key];
    if (key === "ladder") { av = (av || []).join(" "); bv = (bv || []).join(" "); }
    if (key === "active") { av = av ? 1 : 0; bv = bv ? 1 : 0; return (av - bv) * dir; }
    if (key === "type") {
      return (TYPES.indexOf(av) - TYPES.indexOf(bv)) * dir
             || a.customer.localeCompare(b.customer);
    }
    const c = String(av || "").localeCompare(String(bv || ""), undefined, { numeric: true });
    return c * dir || a.id.localeCompare(b.id);
  });
}

/* --------------------------- rendering --------------------------- */
function renderSelect(el, label, values, keep) {
  const cur = keep ?? el.value;
  el.innerHTML = `<option value="">${label}: All</option>` +
    values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
  el.value = values.includes(cur) ? cur : "";
}

function renderFilters() {
  renderSelect($("#fCustomer"), "Customer", uniq("customer"));
  // Divisions are scoped to the selected customer.
  const cust = $("#fCustomer").value;
  const divs = [...new Set(rules
    .filter(r => !cust || r.customer === cust)
    .map(r => (r.division || "").trim()).filter(Boolean))].sort();
  renderSelect($("#fDivision"), "Division", divs);
  renderSelect($("#fCategory"), "Category", uniq("category"));
  renderSelect($("#fEnd"), "End", uniq("end"));

  const f = activeFilters();
  const any = f.customer || f.division || f.category || f.end || f.q || typeFilter.size;
  $("#btnClear").hidden = !any;
}

function ladderHTML(list) {
  if (!list || !list.length) return '<span class="dash">—</span>';
  return '<span class="ladder">' + list.map((b, i) =>
    `<span class="brand"><span class="rank">${i + 1}</span>${esc(b)}</span>`).join("") +
    "</span>";
}

function render() {
  renderFilters();

  const base = baseFiltered();
  const counts = Object.fromEntries(TYPES.map(t =>
    [t, base.filter(r => r.type === t).length]));
  document.querySelectorAll("#view-rules .cnt").forEach(btn => {
    const t = btn.dataset.type;
    btn.textContent = t[0] + t.slice(1).toLowerCase() + " " + counts[t];
    btn.setAttribute("aria-pressed", typeFilter.has(t));
    btn.classList.toggle("dim", counts[t] === 0 && !typeFilter.has(t));
  });

  const rows = visibleRules();
  $("#ruleTotal").textContent = "Rules: " + base.length;
  $("#showing").textContent = rows.length === rules.length
    ? `${rules.length} total`
    : `showing ${rows.length} of ${rules.length}`;

  document.querySelectorAll("#headRow th[data-key]").forEach(th => {
    const on = th.dataset.key === sort.key;
    th.classList.toggle("sorted", on);
    th.querySelector(".caret").textContent = on && sort.dir < 0 ? "▼" : "▲";
  });

  const tb = $("#tbody");
  if (!rows.length) {
    tb.innerHTML = `<tr class="empty"><td colspan="10">
      No rules match these filters. <button class="ctl ghost" onclick="clearFilters()">Clear filters</button>
      </td></tr>`;
    return;
  }

  tb.innerHTML = rows.map(r => `
    <tr data-id="${r.id}" class="${r.active ? "" : "off"}">
      <td class="cust">${esc(r.customer)}</td>
      <td>${r.division ? `<span class="chip">${esc(r.division)}</span>`
                       : '<span class="dash">—</span>'}</td>
      <td>${esc(r.category) || '<span class="dash">—</span>'}</td>
      <td>${esc(r.end) || '<span class="dash">—</span>'}</td>
      <td class="num">${esc(r.size) || '<span class="dash">—</span>'}</td>
      <td><span class="tp ${r.type}">${r.type}</span></td>
      <td>${ladderHTML(r.ladder)}</td>
      <td>${esc(r.detail)}</td>
      <td><button class="tog" data-act="toggle" aria-pressed="${!!r.active}"
                  aria-label="Toggle active"></button></td>
      <td>
        <div class="rowact">
          <button class="iconbtn" data-act="edit" aria-label="Edit rule">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11.2 2.3 13.7 4.8 5.5 13H3v-2.5z" stroke-linejoin="round"/></svg>
          </button>
          <button class="iconbtn danger" data-act="delete" aria-label="Delete rule">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5 5 13.5h6l.5-9" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </td>
    </tr>`).join("");
}

/* ---------------------------- actions ---------------------------- */
function clearFilters() {
  ["#fCustomer", "#fDivision", "#fCategory", "#fEnd"].forEach(s => $(s).value = "");
  $("#fSearch").value = "";
  typeFilter.clear();
  render();
}
window.clearFilters = clearFilters;

$("#tbody").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const id = btn.closest("tr").dataset.id;
  const rule = rules.find(r => r.id === id);
  if (!rule) return;

  if (btn.dataset.act === "toggle") {
    rule.active = !rule.active;
    save();
    render();
    toast(`${rule.id} ${rule.active ? "activated" : "deactivated"}`);
  } else if (btn.dataset.act === "edit") {
    openModal(rule);
  } else if (btn.dataset.act === "delete") {
    rules = rules.filter(r => r.id !== id);
    save();
    render();
    toast(`Deleted ${id} — ${rule.customer}, ${rule.category || "general"}`);
  }
});

document.querySelectorAll("#headRow th[data-key]").forEach(th => {
  th.querySelector("button").addEventListener("click", () => {
    const k = th.dataset.key;
    sort = { key: k, dir: sort.key === k ? -sort.dir : 1 };
    render();
  });
});

["#fCustomer", "#fDivision", "#fCategory", "#fEnd"].forEach(s =>
  $(s).addEventListener("change", render));
$("#fSearch").addEventListener("input", render);
$("#btnClear").addEventListener("click", clearFilters);

document.querySelectorAll("#view-rules .cnt").forEach(btn =>
  btn.addEventListener("click", () => {
    const t = btn.dataset.type;
    typeFilter.has(t) ? typeFilter.delete(t) : typeFilter.add(t);
    render();
  }));

/* ----------------------------- modal ----------------------------- */
function ladderRow(value) {
  const div = document.createElement("div");
  div.className = "ledrow";
  div.innerHTML = `
    <span class="rank"></span>
    <input class="brandin" value="${esc(value)}" placeholder="Brand name">
    <button class="iconbtn" data-led="up"   style="opacity:1" aria-label="Move up">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 12V4M4.5 7.5 8 4l3.5 3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="iconbtn" data-led="down" style="opacity:1" aria-label="Move down">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 4v8M4.5 8.5 8 12l3.5-3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="iconbtn danger" data-led="remove" style="opacity:1" aria-label="Remove brand">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m4 4 8 8M12 4l-8 8" stroke-linecap="round"/></svg></button>`;
  return div;
}
function renumberLadder() {
  [...$("#ladderEdit").children].forEach((row, i) =>
    row.querySelector(".rank").textContent = i + 1);
}
$("#ladderEdit").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-led]");
  if (!btn) return;
  const row = btn.closest(".ledrow");
  const box = $("#ladderEdit");
  if (btn.dataset.led === "remove") row.remove();
  if (btn.dataset.led === "up" && row.previousElementSibling)
    box.insertBefore(row, row.previousElementSibling);
  if (btn.dataset.led === "down" && row.nextElementSibling)
    box.insertBefore(row.nextElementSibling, row);
  renumberLadder();
});
$("#btnAddBrand").addEventListener("click", () => {
  const row = ladderRow("");
  $("#ladderEdit").appendChild(row);
  renumberLadder();
  row.querySelector("input").focus();
});

function fillDatalists() {
  const map = { customerList: "customer", divisionList: "division",
                categoryList: "category", endList: "end" };
  for (const [listId, key] of Object.entries(map)) {
    $("#" + listId).innerHTML = uniq(key)
      .map(v => `<option value="${esc(v)}">`).join("");
  }
}

function openModal(rule) {
  fillDatalists();
  editingId = rule ? rule.id : null;
  $("#modalTitle").textContent = rule ? `Edit rule ${rule.id}` : "Add Rule";
  $("#mCustomer").value = rule?.customer || $("#fCustomer").value || "";
  $("#mDivision").value = rule?.division || "";
  $("#mCategory").value = rule?.category || $("#fCategory").value || "";
  $("#mEnd").value = rule?.end || "";
  $("#mSize").value = rule?.size || "";
  $("#mType").value = rule?.type || "PREFERENCE";
  $("#mDetail").value = rule?.detail || "";
  $("#mActive").setAttribute("aria-pressed", rule ? !!rule.active : true);
  $("#btnDelete").hidden = !rule;
  $("#modalErr").hidden = true;

  const box = $("#ladderEdit");
  box.innerHTML = "";
  (rule?.ladder || []).forEach(b => box.appendChild(ladderRow(b)));
  renumberLadder();

  $("#backdrop").hidden = false;
  $("#mCustomer").focus();

/* ------------------------- import / export ------------------------ */
function toCSV(rows) {
  const q = (v) => {
    const s = String(v ?? "");
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [HEADERS.map(q).join(",")];
  for (const r of rows) {
    lines.push([r.customer, r.division, r.category, r.end, r.size, r.type,
                (r.ladder || []).join(" | "), r.detail,
                r.active ? "Yes" : "No"].map(q).join(","));
  }
  return lines.join("\r\n");
}

/** Minimal RFC-4180 parser — handles quoted fields, embedded commas/newlines. */
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  text = text.replace(/^﻿/, "").replace(/\r\n/g, "\n");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') inQuotes = false;
      else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else field += c;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ""));
}

$("#btnExport").addEventListener("click", () => {

  const reader = new FileReader();
  reader.onload = () => {
    try {
      const rows = parseCSV(reader.result);
      if (rows.length < 2) throw new Error("no data rows");
      const head = rows[0].map(h => h.trim().toLowerCase());
      const at = (name) => head.indexOf(name.toLowerCase());
      const idx = HEADERS.map(at);
      if (idx[0] < 0 || idx[5] < 0)

      const imported = rows.slice(1).map(r => {
        const get = (i) => (i >= 0 ? (r[i] || "").trim() : "");
        return {
          customer: get(idx[0]), division: get(idx[1]), category: get(idx[2]),
          end: get(idx[3]), size: get(idx[4]),

          ladder: get(idx[6]).split(/\s*[|>]\s*/).map(s =>
            s.replace(/^\d+[.)]\s*/, "").trim()).filter(Boolean),
          detail: get(idx[7]),
          active: !/^(no|false|0|off)$/i.test(get(idx[8]) || "yes"),
        };
      }).filter(r => r.customer);

      imported.forEach(r => { if (!TYPES.includes(r.type)) r.type = "NOTE"; });

      save(); render();

      toast("Import failed — " + err.message);
    }
    e.target.value = "";
  };
  reader.readAsText(file);
});

  let best = null, bestScore = 0;
  for (const e of CODEBOOK) {
    const have = new Set(norm(e.raw).split(" ").filter(w => w.length > 2));
    let score = 0;
    want.forEach(w => { if (have.has(w)) score++; });
    if (score > bestScore) { bestScore = score; best = e; }
  }
  if (best && bestScore >= 2 && best.status !== "RFQ") {
    return { ...best, status: "Review", source: "AI",
             conf: Math.max(55, (best.conf || 80) - 14) };
  }
  return { status: "RFQ", code: "RFQ", rk: "", inv: null, mba: null,
           source: "AI", conf: 5, fam: "cgi10" };
}

function buildRow(line, mark) {
  const { qty, desc } = parseLine(line);
  const hit = BOOK.get(norm(desc)) || fallbackMatch(desc);
  return {
    id: "pc" + mark, mark, qty, cdesc: desc,
    status: hit.status, code: hit.code, rk: hit.rk, inv: hit.inv,
    mba: hit.mba, source: hit.source, conf: hit.conf, fam: hit.fam, reason: "",
  };
}

/* ------------------- shared column sorting (PC + Admin) -------------------
 * Same click-to-sort / caret pattern as the Rule Engine's headRow, applied
 * to the two other tables now that they have search filtering too. */
const NUMERIC_KEYS = new Set(["mark", "qty", "inv", "conf"]);

function sortRows(rows, sortState) {
  const { key, dir } = sortState;
  if (!key) return rows;
  return [...rows].sort((a, b) => {
    let av = a[key], bv = b[key];
    if (NUMERIC_KEYS.has(key)) {
      av = (av === null || av === undefined) ? -Infinity : av;
      bv = (bv === null || bv === undefined) ? -Infinity : bv;
      return (av - bv) * dir || a.mark - b.mark;
    }
    const c = String(av ?? "").localeCompare(String(bv ?? ""), undefined, { numeric: true });
    return c * dir || a.mark - b.mark;
  });
}

function updateSortHeaders(rowSel, sortState) {
  document.querySelectorAll(`${rowSel} th[data-key]`).forEach(th => {
    const on = th.dataset.key === sortState.key;
    th.classList.toggle("sorted", on);
    th.querySelector(".caret").textContent = on && sortState.dir < 0 ? "▼" : "▲";
  });
}

function wireSortHeaders(rowSel, getSort, setSort, rerenderFn) {
  document.querySelectorAll(`${rowSel} th[data-key]`).forEach(th => {
    th.querySelector("button").addEventListener("click", () => {
      const k = th.dataset.key;
      const cur = getSort();
      setSort({ key: k, dir: cur.key === k ? -cur.dir : 1 });
      rerenderFn();
    });
  });
}

    rerender(screen);

  const info = e.target.closest("[data-reason]");
  if (info) { e.stopPropagation(); openPop(info, screen); return; }

  const app = e.target.closest("[data-app]");
  if (app && screen === "ad") {

           <span class="cc"><span class="ccode">${esc(typed)}</span>
           <span class="cdesc">Not in the candidate list — confirm as a manual code</span></span>
           <span class="cm"><span class="mp lo">—</span></span><span class="ci">—</span></button>`
      : `<div class="sub" style="padding:12px 4px">No candidates on file for this line.</div>`;
  } else {
    listEl.innerHTML = list.map(c => `
      <button class="cand" data-code="${esc(c.code)}" aria-pressed="${popCtx.sel === c.code}">
        <span class="cc"><span class="ccode">${esc(c.code)}</span>
          <span class="cdesc">${esc(c.desc)}</span></span>
        <span class="cm"><span class="mp ${mpClass(c.match)}">${c.match}%</span></span>
        <span class="ci${c.inv === 0 ? " zero" : ""}">${c.inv}</span>
      </button>`).join("");
  }

  const sel = $("#popSelect");
  sel.innerHTML = `<option value="">Select Candidate</option>` +
    list.map(c => `<option value="${esc(c.code)}">${esc(c.code)} — ${esc(c.desc)}</option>`).join("");
  sel.value = (popCtx.sel && list.some(c => c.code === popCtx.sel)) ? popCtx.sel : "";
}

function placePop(btn) {
  const pop = $("#pop");
  const r = btn.getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let left = r.right - w;
  left = Math.min(Math.max(12, left), Math.max(12, window.innerWidth - w - 12));
  let top = r.bottom + 8;
  if (top + h > window.innerHeight - 12) top = Math.max(12, r.top - h - 8);
  pop.style.left = left + "px";
  pop.style.top = top + "px";
}

function openPop(btn, screen) {
  const id = btn.closest("tr").dataset.row;
  const row = rowsFor(screen).find(r => r.id === id);
  if (!row) return;
  const cands = CANDS[row.fam] || [];
  popCtx = { screen, rowId: id, cands, sel: null, filter: "" };

  $("#popSub").textContent = `${cands.length} Candidate${cands.length === 1 ? "" : "s"}`;
  $("#popSearch").value = "";
  $("#popReason").value = row.reason || (row.status === "Out of Stock" ? "Out of stock" : "");
  renderCands();
  $("#pop").hidden = false;
  placePop(btn);
}

function closePop() {
  const pop = $("#pop");
  if (pop) pop.hidden = true;
  popCtx = null;
}

$("#popList").addEventListener("click", (e) => {
  const b = e.target.closest(".cand");
  if (!b || !popCtx) return;
  // renderCands() replaces this node, so the click must not reach the
  // outside-click handler below — a detached target looks "outside".
  e.stopPropagation();
  popCtx.sel = b.dataset.manual ? "__manual" : b.dataset.code;
  renderCands();
});
$("#popSelect").addEventListener("change", (e) => {
  if (!popCtx) return;
  popCtx.sel = e.target.value || null;
  renderCands();
});
$("#popSearch").addEventListener("input", (e) => {
  if (!popCtx) return;
  popCtx.filter = e.target.value;
  renderCands();
});

$("#popConfirm").addEventListener("click", () => {
  if (!popCtx) return;
  const { screen, rowId, sel } = popCtx;
  let code, desc, inv, mba, match = null;

  if (sel === "__manual") {
    code = $("#popSearch").value.trim().toUpperCase();
    desc = "MANUAL CODE ENTRY — PENDING ITEM MASTER SYNC";
    inv = null; mba = null;
  } else {
    const c = popCtx.cands.find(x => x.code === sel);
    if (!c) { toast("Pick a candidate first."); return; }
    code = c.code; desc = c.desc; inv = c.inv; mba = c.mba; match = c.match;
  }
  if (!code) { toast("Pick a candidate first."); return; }

  const row = rowsFor(screen).find(r => r.id === rowId);
  const wasOOS = row.status === "Out of Stock";
  row.code = code;
  row.rk = desc;
  row.inv = inv;
  row.mba = mba;
  if (match !== null) row.conf = match;
  // A person confirming/overriding a pick is what makes it "Manual" — Auto
  // only ever comes from the AI itself. Out of Stock stays its own bucket
  // even after a person picks the replacement — that's the point of the
  // status vs. folding it into Manual with the reason buried in a text field.
  row.status = wasOOS ? "Out of Stock" : "Manual";
  row.source = "Manual";     // a person made the call
  row.reason = $("#popReason").value.trim() || (wasOOS ? "Out of stock" : "");

  closePop();
  rerender(screen);
  toast(wasOOS ? `Marked Out of Stock — swapped to ${code}` : `Marked Manual — ${code}`);
});

/* close on outside click / Escape */
document.addEventListener("click", (e) => {
  if (!popCtx) return;
  // composedPath() is captured at dispatch, so it still reports the popover
  // even if the handler above swapped the clicked node out of the DOM.
  const inside = (e.composedPath?.() || []).some(n => n.id === "pop")
                 || (e.target.closest && e.target.closest("#pop"));
  if (!inside) closePop();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && popCtx) { e.stopPropagation(); closePop(); }
});
window.addEventListener("resize", closePop);
document.querySelectorAll(".tablewrap").forEach(w =>
  w.addEventListener("scroll", closePop));

/* ------------------------------- start up ------------------------------- */
renderPC();
renderAD();
showView("partcoding");
</script>
</body>
</html>
